<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Interactiva: Propiedades de los Triángulos</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --secondary: #059669;
            --accent: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 1rem;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.5;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a, #0d9488);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
            padding: 1.5rem;
        }

        .login-card {
            padding: 2rem 1rem;
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin: 0 auto 1.5rem;
            max-width: 500px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .select-student,
        .input-read-only {
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1.05rem;
            outline: none;
            padding: 0.8rem 1rem;
            width: 100%;
        }

        .input-read-only {
            background: #f1f5f9;
            color: var(--primary);
            font-weight: 600;
        }

        .student-bar {
            background: #ffffff;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .student-bar strong {
            color: var(--primary);
        }

        .progress-bar {
            background-color: #e2e8f0;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .progress-fill {
            background-color: var(--secondary);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .step-card {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }

        .step-card.active {
            display: block;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }

        .content-box {
            background: #f1f5f9;
            border-left: 4px solid var(--primary-light);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1rem;
        }

        .notebook-box {
            background: #fffbe0;
            border-left: 4px solid #d97706;
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin: 1rem 0;
            font-size: 0.95rem;
        }

        .interactive-demo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .hint-btn {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: inline-block;
        }

        .hint-box {
            display: none;
            background: #fffbe0;
            border: 1px solid #fde68a;
            padding: 0.8rem;
            border-radius: 6px;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #78350f;
        }

        .hint-box.show {
            display: block;
        }

        .btn {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary);
        }

        .btn-success {
            background-color: var(--secondary);
        }

        .btn-success:hover {
            background-color: #047857;
        }

        .btn-secondary {
            background-color: #64748b;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: var(--text);
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        .btn-outline:hover {
            background: #e2e8f0;
        }

        .question-box {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
        }

        .option-btn:hover {
            background: #e2e8f0;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            align-items: center;
        }

        input[type="number"] {
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            width: 100px;
            font-size: 1rem;
        }

        .feedback {
            margin-top: 0.8rem;
            padding: 0.8rem;
            border-radius: 6px;
            display: none;
        }

        .feedback.correct {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            display: block;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            display: block;
        }

        .notebook-check {
            margin-top: 1rem;
            display: none;
            background: #fef3c7;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #fde68a;
        }

        .notebook-check.show {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <header>
        <h1>Guía Interactiva: Geometría de Triángulos</h1>
        <p>I.E. Nuestra Señora del Rosario - Grado Sexto (601 AN)</p>
    </header>

    <main class="container">
        <div id="login-view" class="login-card">
            <h2>Bienvenido a la Actividad Interactiva</h2>
            <p>Selecciona tu nombre para comenzar o continuar con tu progreso.</p>

            <div class="form-group">
                <label for="grade-select">Grado:</label>
                <input type="text" id="grade-select" class="input-read-only" value="601 AN" readonly>
            </div>

            <div class="form-group">
                <label for="student-select">Estudiante:</label>
                <select id="student-select" class="select-student">
                    <option value="">-- Selecciona tu Nombre --</option>
                </select>
            </div>

            <button class="btn btn-success" onclick="startActivity()" style="margin-top: 1rem;">
                Ingresar a la Guía
            </button>
        </div>
    </main>

    <div class="student-bar" id="studentBar" style="display: none;">
        <span>Estudiante: <strong id="currentStudentName">-</strong></span>
        <div style="display: flex; gap: 0.5rem;">
            <button class="btn btn-secondary" onclick="manualSaveProgress()">Guardar avance</button>
            <button class="btn btn-danger" onclick="confirmReset()">Reiniciar</button>
        </div>
    </div>

    <div class="progress-bar hidden">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="stepsContainer" class="hidden"></div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE GOOGLE APPS SCRIPT (SHEETS)
        // ==========================================
        // Reemplaza esta URL con la URL de tu Web App desplegada desde Google Apps Script
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybRNRET1M9-elBBn1RZDvBwSacnnQhg-7Ws4B0mQRqVDEQA26Ic87yd-ncyyW3tA/exec";
        const GRADE_NAME = "601 AN";
        const studentList = [
            "BOCANEGRA FORERO ROBIN ALEJANDRO",
            "BOCANEGRA VANEGAS ROBEN ESTIVEN",
            "CARDENAS DEVIA EDWAR ANDRES",
            "CORRALES MEJIA MARIBEL",
            "DIAZ ROMERO ZARAY XILENA",
            "FERNANDEZ GONZALEZ FRANKO DAVID",
            "FORERO MENDOZA ROLLERTH",
            "GARZON SANCHEZ HELEN SOFIA",
            "GARZON SANCHEZ ORIANA THALIA",
            "GIRALDO LOZANO MAICOL YOHANI",
            "GUZMAN CHAGUALA ANGIE MILENA",
            "MASMELA VAQUIRO KAREN NICOL",
            "OSORIO VALENCIA DIANA SOFIA",
            "OYOLA BETANCOURTH JESUS MANUEL",
            "ROJAS TORRES NICOL VALERIA",
            "SANCHEZ CAPERA JORDAN FELIPE",
            "SANCHEZ LASSO THOMAS SANTIAGO",
            "SUAREZ MENDEZ OSCAR JULIAN",
            "VANEGAS TAPIERO DILAN SANTIAGO"
        ];

        const stepsData = [
            // Paso 1: INTRODUCCIÓN
            {
                type: "theory",
                title: "Paso 1: ¿Qué es un Triángulo y cómo se clasifica?",
                content: `
                    <p>Un triángulo es una figura geométrica plana de 3 lados, 3 vértices y 3 ángulos internos.</p>
                    <br>
                    <p>En esta guía aprenderemos a clasificar los triángulos <strong>según la longitud de sus lados</strong> en tres grupos:</p>
                    <ul style="margin-left: 1.5rem; margin-top: 0.5rem;">
                        <li><strong>Equilátero:</strong> Todos sus lados miden exactamente lo mismo.</li>
                        <li><strong>Isósceles:</strong> Tiene 2 lados iguales y 1 lado diferente.</li>
                        <li><strong>Escaleno:</strong> Todos sus lados tienen medidas diferentes.</li>
                    </ul>
                `,
                notebook: "Transcribe en tu cuaderno el título 'Clasificación de Triángulos según sus Lados' y copia las definiciones de Triángulo Equilátero, Isósceles y Escaleno."
            },

            // Paso 2: EQUILÁTERO - TEORÍA & DEMO
            {
                type: "interactive_theory",
                title: "Paso 2: Triángulo Equilátero",
                content: `
                    <p>Un triángulo <strong>Equilátero</strong> tiene sus 3 lados de igual longitud (lado a = lado b = lado c). Además, sus 3 ángulos internos siempre miden 60°.</p>
                `,
                svg: `
                    <svg width="320" height="190" viewBox="-50 0 320 190">
                        <polygon points="110,20 20,170 200,170" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
                        <line x1="60" y1="95" x2="70" y2="100" stroke="#1e40af" stroke-width="3"/>
                        <line x1="150" y1="100" x2="160" y2="95" stroke="#1e40af" stroke-width="3"/>
                        <line x1="105" y1="170" x2="105" y2="160" stroke="#1e40af" stroke-width="3"/>
                        <text x="110" y="185" text-anchor="middle" font-weight="bold">Lado a = 8 cm</text>
                        <text x="45" y="90" text-anchor="end" font-weight="bold">Lado b = 8 cm</text>
                        <text x="175" y="90" text-anchor="start" font-weight="bold">Lado c = 8 cm</text>
                    </svg>
                `,
                notebook: "En tu cuaderno, dibuja un triángulo equilátero con regla, escribe la propiedad de sus 3 lados iguales y anota que cada uno de sus ángulos internos mide 60°."
            },

            // Paso 3: EQUILÁTERO - EJERCICIO 1
            {
                type: "exercise",
                title: "Paso 3: Ejercicio 1 - Triángulo Equilátero",
                context: "En la entrada de la IE Nuestra Señora del Rosario se construyó una señal informativa triangular cuyos 3 lados miden 45 cm cada uno.",
                question: "¿Qué tipo de triángulo forma la señal de tránsito?",
                options: ["Isósceles", "Equilátero", "Escaleno"],
                correct: "Equilátero",
                explanation: "Es un triángulo Equilátero porque sus 3 lados miden exactamente lo mismo (45 cm).",
                notebook: "Dibuja la señal triangular en tu cuaderno, marca sus 3 lados con 45 cm y escribe la justificación."
            },

            // Paso 4: EQUILÁTERO - EJERCICIO 2
            {
                type: "exercise_input",
                title: "Paso 4: Ejercicio 2 - Triángulo Equilátero",
                context: "Un parque infantil en Chaparral tiene una estructura de escalada en forma de triángulo equilátero. Si la suma de sus tres lados (perímetro) es de 18 metros, ¿cuánto mide uno solo de sus lados?",
                svg: `
                    <svg width="200" height="160" viewBox="0 0 200 160">
                        <polygon points="100,15 20,140 180,140" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
                        <text x="100" y="155" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="bold">¿Lado = ?</text>
                        <text x="100" y="90" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="bold">Perímetro = 18 m</text>
                    </svg>
                `,
                hint: "Recuerda que los 3 lados de un triángulo equilátero son exactamente iguales. Divide el perímetro total (18) entre los 3 lados.",
                unit: "m",
                correctValue: 6,
                explanation: "Como el triángulo equilátero tiene 3 lados iguales, dividimos el perímetro entre 3: 18 ÷ 3 = 6 m.",
                notebook: "Escribe la operación en tu cuaderno: Perímetro ÷ 3 = 18 ÷ 3 = 6 m y realiza el dibujo."
            },

            // Paso 5: EQUILÁTERO - EJERCICIO 3
            {
                type: "exercise",
                title: "Paso 5: Ejercicio 3 - Triángulo Equilátero",
                context: "En un mapa topográfico del Cañón de las Hermosas, se marca una zona de conservación delimitada por un triángulo equilátero. Si uno de sus ángulos internos mide 60°, ¿cuánto suman sus tres ángulos internos?",
                svg: `
                    <svg width="200" height="160" viewBox="0 0 200 160">
                        <polygon points="100,20 25,140 175,140" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
                        <text x="100" y="50" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">60°</text>
                        <text x="50" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">60°</text>
                        <text x="150" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">60°</text>
                    </svg>
                `,
                options: ["120°", "180°", "360°"],
                correct: "180°",
                explanation: "La suma de los ángulos internos de CUALQUIER triángulo siempre es 180°. En el equilátero es: 60° + 60° + 60° = 180°.",
                notebook: "Anota en tu cuaderno la regla fundamental: 'La suma de los ángulos internos de todo triángulo es siempre 180°'."
            },

            // Paso 6: EQUILÁTERO - EJERCICIO 4
            {
                type: "exercise_input",
                title: "Paso 6: Ejercicio 4 - Triángulo Equilátero",
                context: "Un artesano de Chaparral diseña un mosaico con azulejos equiláteros. Cada lado mide 12 cm. ¿Cuál es el perímetro total de cada azulejo?",
                svg: `
                    <svg width="200" height="160" viewBox="0 0 200 160">
                        <polygon points="100,15 20,140 180,140" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
                        <text x="100" y="155" text-anchor="middle" font-weight="bold" fill="#92400e">12 cm</text>
                        <text x="50" y="75" text-anchor="end" font-weight="bold" fill="#92400e">12 cm</text>
                        <text x="150" y="75" text-anchor="start" font-weight="bold" fill="#92400e">12 cm</text>
                    </svg>
                `,
                hint: "El perímetro es la suma de los 3 lados. Puedes sumar 12 + 12 + 12 o multiplicar 12 × 3.",
                unit: "cm",
                correctValue: 36,
                explanation: "El perímetro de un triángulo equilátero es 3 × lado = 3 × 12 cm = 36 cm.",
                notebook: "Calcula en tu cuaderno: P = 12 + 12 + 12 = 36 cm y representa la figura con sus datos."
            },

            // Paso 7: ISÓSCELES - TEORÍA & DEMO
            {
                type: "interactive_theory",
                title: "Paso 7: Triángulo Isósceles",
                content: `
                    <p>Un triángulo <strong>Isósceles</strong> tiene <strong>2 lados de igual medida</strong> y 1 lado diferente (llamado base). Los ángulos opuestos a los lados iguales también son iguales entre sí.</p>
                `,
                svg: `
                    <svg width="220" height="190" viewBox="0 0 220 190">
                        <polygon points="110,15 40,170 180,170" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
                        <line x1="70" y1="90" x2="80" y2="95" stroke="#b45309" stroke-width="3"/>
                        <line x1="140" y1="95" x2="150" y2="90" stroke="#b45309" stroke-width="3"/>
                        <text x="110" y="185" text-anchor="middle" font-weight="bold">Base = 6 cm</text>
                        <text x="60" y="80" text-anchor="end" font-weight="bold">10 cm</text>
                        <text x="160" y="80" text-anchor="start" font-weight="bold">10 cm</text>
                    </svg>
                `,
                notebook: "En tu cuaderno, dibuja un triángulo isósceles anotando sus dos lados iguales y el lado desigual (base)."
            },

            // Paso 8: ISÓSCELES - EJERCICIO 5
            {
                type: "exercise",
                title: "Paso 8: Ejercicio 5 - Triángulo Isósceles",
                context: "El techo de una casa tradicional campesina en Chaparral tiene una estructura donde dos vigas de madera miden 5 metros y la base mide 6 metros.",
                svg: `
                    <svg width="220" height="140" viewBox="0 0 220 140">
                        <polygon points="110,20 20,120 200,120" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
                        <text x="110" y="135" text-anchor="middle" font-weight="bold" fill="#991b1b">Base = 6 m</text>
                        <text x="55" y="65" text-anchor="end" font-weight="bold" fill="#991b1b">5 m</text>
                        <text x="165" y="65" text-anchor="start" font-weight="bold" fill="#991b1b">5 m</text>
                    </svg>
                `,
                hint: "Observa las medidas: dos lados miden 5 m y uno mide 6 m. ¿Qué triángulo tiene 2 lados iguales y 1 diferente?",
                question: "¿A qué clasificación corresponde esta estructura según sus lados?",
                options: ["Equilátero", "Isósceles", "Escaleno"],
                correct: "Isósceles",
                explanation: "Es Isósceles porque posee exactamente 2 lados iguales (5 m) y 1 diferente (6 m).",
                notebook: "Dibuja el perfil del techo en tu cuaderno con sus medidas e indica por qué es isósceles."
            },

            // Paso 9: ISÓSCELES - EJERCICIO 6
            {
                type: "exercise_input",
                title: "Paso 9: Ejercicio 6 - Triángulo Isósceles",
                context: "Un triángulo isósceles tiene sus dos lados iguales de 14 cm cada uno y su perímetro es de 38 cm. ¿Cuánto mide el lado diferente (la base)?",
                svg: `
                    <svg width="200" height="150" viewBox="0 0 200 150">
                        <polygon points="100,15 30,130 170,130" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
                        <text x="55" y="70" text-anchor="end" font-weight="bold" fill="#15803d">14 cm</text>
                        <text x="145" y="70" text-anchor="start" font-weight="bold" fill="#15803d">14 cm</text>
                        <text x="100" y="145" text-anchor="middle" font-weight="bold" fill="#166534">Base = ?</text>
                    </svg>
                `,
                hint: "Suma los dos lados iguales (14 + 14 = 28) y réstalos del perímetro total (38).",
                unit: "cm",
                correctValue: 10,
                explanation: "Sumamos los dos lados iguales: 14 + 14 = 28 cm. Restamos del perímetro: 38 - 28 = 10 cm.",
                notebook: "Escribe el procedimiento en tu cuaderno: 38 - (14 + 14) = 10 cm y realiza el dibujo correspondiente."
            },

            // Paso 10: ISÓSCELES - EJERCICIO 7
            {
                type: "exercise",
                title: "Paso 10: Ejercicio 7 - Triángulo Isósceles",
                context: "En un triángulo isósceles, los dos ángulos opuestos a los lados iguales miden 50° cada uno. ¿Cuánto mide el tercer ángulo superior?",
                svg: `
                    <svg width="200" height="150" viewBox="0 0 200 150">
                        <polygon points="100,20 30,130 170,130" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
                        <text x="100" y="45" text-anchor="middle" font-weight="bold" fill="#6b21a8">¿ Angle = ?</text>
                        <text x="55" y="120" text-anchor="middle" font-weight="bold" fill="#6b21a8">50°</text>
                        <text x="145" y="120" text-anchor="middle" font-weight="bold" fill="#6b21a8">50°</text>
                    </svg>
                `,
                hint: "Los 3 ángulos internos deben sumar 180°. Si dos miden 50°, juntos suman 100°. Resta 180° - 100°.",
                options: ["80°", "100°", "90°"],
                correct: "80°",
                explanation: "La suma interna debe ser 180°. Suman los conocidos: 50° + 50° = 100°. El ángulo restante es: 180° - 100° = 80°.",
                notebook: "Calcula el ángulo en tu cuaderno: 180° - (50° + 50°) = 80° y dibuja el triángulo."
            },

            // Paso 11: ISÓSCELES - EJERCICIO 8
            {
                type: "exercise_input",
                title: "Paso 11: Ejercicio 8 - Triángulo Isósceles",
                context: "Una escuadra de dibujo de la clase de geometría de la IE Nuestra Señora del Rosario tiene dos lados de 20 cm y uno de 28 cm. ¿Cuál es su perímetro?",
                svg: `
                    <svg width="250" height="150" viewBox="-50 0 250 150">
                        <polygon points="30,20 30,130 170,130" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
                        <text x="20" y="80" text-anchor="end" font-weight="bold" fill="#c2410c">20 cm</text>
                        <text x="100" y="145" text-anchor="middle" font-weight="bold" fill="#c2410c">20 cm</text>
                        <text x="110" y="65" text-anchor="start" font-weight="bold" fill="#c2410c">28 cm</text>
                    </svg>
                `,
                hint: "El perímetro es la suma de los tres lados: 20 + 20 + 28.",
                unit: "cm",
                correctValue: 68,
                explanation: "El perímetro es la suma de sus lados: 20 + 20 + 28 = 68 cm.",
                notebook: "Resuelve en tu cuaderno: P = 20 + 20 + 28 = 68 cm."
            },

            // Paso 12: ESCALENO - TEORÍA & DEMO
            {
                type: "interactive_theory",
                title: "Paso 12: Triángulo Escaleno",
                content: `
                    <p>Un triángulo <strong>Escaleno</strong> tiene <strong>sus 3 lados con medidas completamente diferentes</strong> (lado a ≠ lado b ≠ lado c). Sus 3 ángulos internos también son todos distintos.</p>
                `,
                svg: `
                    <svg width="270" height="190" viewBox="-50 0 270 190">
                        <polygon points="40,30 20,170 200,150" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
                        <text x="20" y="100" text-anchor="end" font-weight="bold">a = 14 cm</text>
                        <text x="110" y="175" text-anchor="middle" font-weight="bold">b = 18 cm</text>
                        <text x="130" y="80" text-anchor="start" font-weight="bold">c = 21 cm</text>
                    </svg>
                `,
                notebook: "Dibuja en tu cuaderno un triángulo escaleno y explica la propiedad fundamental de sus lados."
            },

            // Paso 13: ESCALENO - EJERCICIO 9
            {
                type: "exercise",
                title: "Paso 13: Ejercicio 9 - Triángulo Escaleno",
                context: "Un terreno cuneiforme a orillas del Río Saldaña tiene bordes que miden 120 metros, 85 metros y 150 metros.",
                svg: `
                    <svg width="270" height="150" viewBox="-50 0 270 150">
                        <polygon points="50,20 20,130 200,110" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
                        <text x="25" y="75" text-anchor="end" font-weight="bold" fill="#166534">85 m</text>
                        <text x="110" y="135" text-anchor="middle" font-weight="bold" fill="#166534">150 m</text>
                        <text x="130" y="55" text-anchor="start" font-weight="bold" fill="#166534">120 m</text>
                    </svg>
                `,
                hint: "Compara los tres lados: 120 m, 85 m y 150 m. Ninguno mide igual al otro.",
                question: "¿A qué tipo de triángulo corresponde la parcela según sus lados?",
                options: ["Escaleno", "Isósceles", "Equilátero"],
                correct: "Escaleno",
                explanation: "Es Escaleno porque sus tres lados miden longitudes completamente distintas.",
                notebook: "Dibuja el mapa del terreno en tu cuaderno con sus dimensiones e indica su tipo."
            },

            // Paso 14: ESCALENO - EJERCICIO 10
            {
                type: "exercise_input",
                title: "Paso 14: Ejercicio 10 - Triángulo Escaleno",
                context: "Un triángulo escaleno tiene un perímetro de 45 cm. Dos de sus lados miden 12 cm y 18 cm. ¿Cuánto mide el tercer lado?",
                svg: `
                    <svg width="250" height="150" viewBox="-50 0 250 150">
                        <polygon points="50,20 20,130 180,110" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
                        <text x="25" y="75" text-anchor="end" font-weight="bold" fill="#1e40af">12 cm</text>
                        <text x="120" y="55" text-anchor="start" font-weight="bold" fill="#1e40af">18 cm</text>
                        <text x="100" y="135" text-anchor="middle" font-weight="bold" fill="#1e40af">Lado 3 = ?</text>
                    </svg>
                `,
                hint: "Suma los dos lados conocidos (12 + 18 = 30) y reste este valor del perímetro total (45).",
                unit: "cm",
                correctValue: 15,
                explanation: "Sumamos los dos conocidos: 12 + 18 = 30 cm. Restamos del perímetro: 45 - 30 = 15 cm.",
                notebook: "Escribe el procedimiento: 45 - (12 + 18) = 15 cm en tu cuaderno."
            },

            // Paso 15: ESCALENO - EJERCICIO 11
            {
                type: "exercise",
                title: "Paso 15: Ejercicio 11 - Triángulo Escaleno",
                context: "Un estudiante mide los ángulos internos de una rampa triangular y obtiene: 40°, 60° y 80°. Como los 3 ángulos son distintos, ¿cómo son las medidas de sus lados?",
                svg: `
                    <svg width="200" height="140" viewBox="0 0 200 140">
                        <polygon points="30,20 20,120 180,120" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
                        <text x="45" y="45" font-weight="bold" fill="#9f1239">80°</text>
                        <text x="35" y="110" font-weight="bold" fill="#9f1239">60°</text>
                        <text x="145" y="110" font-weight="bold" fill="#9f1239">40°</text>
                    </svg>
                `,
                hint: "Existe una regla geométrica: si los 3 ángulos de un triángulo son completamente diferentes, sus 3 lados también deben ser diferentes.",
                options: ["Todas iguales", "Dos iguales y una diferente", "Todas diferentes"],
                correct: "Todas diferentes",
                explanation: "A ángulos diferentes se oponen lados diferentes. Por tanto, si sus 3 ángulos son distintos, es un triángulo Escaleno.",
                notebook: "Copia en tu cuaderno la relación entre ángulos y lados: 'Si un triángulo tiene 3 ángulos diferentes, sus 3 lados también son diferentes'."
            },

            // Paso 16: ESCALENO - EJERCICIO 12
            {
                type: "exercise_input",
                title: "Paso 16: Ejercicio 12 - Triángulo Escaleno",
                context: "Se rodea con cerca un cultivo de café de forma triangular en Chaparral. Los lados miden 35 m, 42 m y 58 m. ¿Cuántos metros de alambre se requieren para 1 sola vuelta de cerramiento?",
                svg: `
                    <svg width="270" height="150" viewBox="-50 0 270 150">
                        <polygon points="60,15 20,130 200,110" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
                        <text x="30" y="75" text-anchor="end" font-weight="bold" fill="#047857">35 m</text>
                        <text x="110" y="135" text-anchor="middle" font-weight="bold" fill="#047857">58 m</text>
                        <text x="140" y="55" text-anchor="start" font-weight="bold" fill="#047857">42 m</text>
                    </svg>
                `,
                hint: "Calcula el perímetro sumando la longitud de los tres lados del cultivo: 35 + 42 + 58.",
                unit: "m",
                correctValue: 135,
                explanation: "Calculamos el perímetro: 35 + 42 + 58 = 135 m.",
                notebook: "Calcula la suma en tu cuaderno: 35 + 42 + 58 = 135 m con el esquema del cultivo."
            },

            // FINALIZACIÓN
            {
                type: "final",
                title: "¡Felicitaciones! Has completado la guía",
                content: `
                    <div style="text-align: center;">
                        <h2 style="color: var(--secondary); margin-bottom: 1rem;">🎉 ¡Excelente trabajo!</h2>
                        <p>Has repasado con éxito las propiedades de los triángulos <strong>Equilátero, Isósceles y Escaleno</strong>.</p>
                        <p id="final-score" style="font-weight: bold; margin-top: 1rem;"></p>
                        <p id="final-grade" style="font-weight: bold; color: var(--secondary);"></p>
                        <div id="send-status" class="sending-status">Enviando nota a Google Sheets...</div>
                        <br>
                        <p>Asegúrate de mostrarle a tu docente de matemáticas el registro en tu cuaderno con todas las figuras, propiedades y procedimientos copiados.</p>
                    </div>
                `
            }
        ];

        let currentStudent = "";
        let currentStep = 0;
        let studentAnswers = {};

        // INICIALIZACIÓN
        window.onload = function () {
            populateStudentDropdown();
            checkStoredStudent();
        };

        function populateStudentDropdown() {
            const select = document.getElementById('student-select');
            studentList.forEach(student => {
                const option = document.createElement('option');
                option.value = student;
                option.textContent = student;
                select.appendChild(option);
            });
        }

        function checkStoredStudent() {
            const savedStudent = localStorage.getItem('triangles_student');
            if (savedStudent && studentList.includes(savedStudent)) {
                currentStudent = savedStudent;
                document.getElementById('currentStudentName').textContent = currentStudent;
                document.getElementById('studentBar').style.display = 'flex';
                document.getElementById('login-view').classList.add('hidden');

                // Cargar progreso del estudiante
                loadProgress();
            } else {
                localStorage.removeItem('triangles_student');
                document.getElementById('login-view').classList.remove('hidden');
            }
        }

        function startActivity() {
            const sel = document.getElementById('student-select');
            if (!sel.value) {
                alert("Por favor selecciona tu nombre de la lista.");
                return;
            }
            currentStudent = sel.value;
            localStorage.setItem('triangles_student', currentStudent);
            document.getElementById('currentStudentName').textContent = currentStudent;
            document.getElementById('studentBar').style.display = 'flex';
            document.getElementById('login-view').classList.add('hidden');

            loadProgress();
        }

        function manualSaveProgress() {
            saveProgress();
            alert("✓ Tu avance ha sido guardado exitosamente en este navegador.");
        }

        function confirmReset() {
            if (confirm("¿Estás seguro de que deseas reiniciar la actividad? Se borrará el progreso actual de esta sesión.")) {
                resetAllData();
            }
        }

        function resetAllData() {
            localStorage.removeItem(`triangles_${currentStudent}_step`);
            localStorage.removeItem(`triangles_${currentStudent}_answers`);
            localStorage.removeItem('triangles_student');

            currentStudent = "";
            currentStep = 0;
            studentAnswers = {};

            document.getElementById('studentBar').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
            document.querySelector('.progress-bar').classList.add('hidden');
            document.getElementById('stepsContainer').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('student-select').value = "";
        }

        function loadProgress() {
            const savedStep = localStorage.getItem(`triangles_${currentStudent}_step`);
            const savedAnswers = localStorage.getItem(`triangles_${currentStudent}_answers`);

            currentStep = savedStep ? parseInt(savedStep) : 0;
            studentAnswers = savedAnswers ? JSON.parse(savedAnswers) : {};

            document.querySelector('.progress-bar').classList.remove('hidden');
            document.getElementById('stepsContainer').classList.remove('hidden');
            renderSteps();
        }

        function saveProgress() {
            if (!currentStudent) return;
            localStorage.setItem(`triangles_${currentStudent}_step`, currentStep);
            localStorage.setItem(`triangles_${currentStudent}_answers`, JSON.stringify(studentAnswers));
        }

        function toggleHint(index) {
            const hb = document.getElementById(`hint-${index}`);
            if (hb) {
                hb.classList.toggle('show');
            }
        }

        function renderSteps() {
            const container = document.getElementById('stepsContainer');
            container.innerHTML = '';

            stepsData.forEach((step, index) => {
                const card = document.createElement('div');
                card.className = `step-card ${index === currentStep ? 'active' : ''}`;
                card.id = `step-${index}`;

                let html = `<div class="step-header">${step.title}</div>`;

                if (step.type === 'theory') {
                    html += `<div class="content-box">${step.content}</div>`;
                    html += `<div class="notebook-box">📖 <strong>Para copiar en el cuaderno:</strong><br>${step.notebook}</div>`;
                    html += `<button class="btn btn-success" onclick="nextStep(${index})">Entendido, ya lo copié en mi cuaderno ➔</button>`;
                }
                else if (step.type === 'interactive_theory') {
                    html += `<div class="content-box">${step.content}</div>`;
                    html += `<div class="interactive-demo">${step.svg}</div>`;
                    html += `<div class="notebook-box">📖 <strong>Para copiar en el cuaderno:</strong><br>${step.notebook}</div>`;
                    html += `<button class="btn btn-success" onclick="nextStep(${index})">Ya dibujé y copié en mi cuaderno ➔</button>`;
                }
                else if (step.type === 'exercise') {
                    const isSolved = studentAnswers[index] && studentAnswers[index].correct;
                    html += `
                        <p style="margin-bottom: 0.8rem;"><strong>Contexto:</strong> ${step.context}</p>
                        ${step.svg ? `<div class="interactive-demo">${step.svg}</div>` : ''}
                        ${step.hint ? `
                            <div>
                                <button class="hint-btn" onclick="toggleHint(${index})">💡 Ver Pista / Ayuda</button>
                                <div class="hint-box" id="hint-${index}">${step.hint}</div>
                            </div>
                        ` : ''}
                        <div class="question-box">
                            <p><strong>${step.question}</strong></p>
                            <div class="options-grid">
                                ${step.options.map(opt => `<button class="option-btn" onclick="checkOption(${index}, '${opt}', '${step.correct}')">${opt}</button>`).join('')}
                            </div>
                            <div class="feedback ${isSolved ? 'correct' : ''}" id="feedback-${index}">
                                ${isSolved ? `¡Correcto! ${step.explanation}` : ''}
                            </div>
                        </div>
                        <div class="notebook-check ${isSolved ? 'show' : ''}" id="notebook-check-${index}">
                            <div class="notebook-box">📖 <strong>Trabajo en Cuaderno:</strong><br>${step.notebook}</div>
                            <button class="btn btn-success" onclick="nextStep(${index})">Ya lo escribí en mi cuaderno ➔</button>
                        </div>
                    `;
                }
                else if (step.type === 'exercise_input') {
                    const isSolved = studentAnswers[index] && studentAnswers[index].correct;
                    const savedVal = isSolved ? studentAnswers[index].val : '';
                    html += `
                        <p style="margin-bottom: 0.8rem;"><strong>Contexto:</strong> ${step.context}</p>
                        ${step.svg ? `<div class="interactive-demo">${step.svg}</div>` : ''}
                        ${step.hint ? `
                            <div>
                                <button class="hint-btn" onclick="toggleHint(${index})">💡 Ver Pista / Ayuda</button>
                                <div class="hint-box" id="hint-${index}">${step.hint}</div>
                            </div>
                        ` : ''}
                        <div class="question-box">
                            <label><strong>Ingresa tu respuesta:</strong></label>
                            <div class="input-group">
                                <input type="number" id="input-${index}" placeholder="Valor" value="${savedVal}">
                                <span><strong>${step.unit}</strong></span>
                                <button class="btn" onclick="checkInput(${index}, ${step.correctValue})">Verificar</button>
                            </div>
                            <div class="feedback ${isSolved ? 'correct' : ''}" id="feedback-${index}">
                                ${isSolved ? `¡Excelente! ${step.explanation}` : ''}
                            </div>
                        </div>
                        <div class="notebook-check ${isSolved ? 'show' : ''}" id="notebook-check-${index}">
                            <div class="notebook-box">📖 <strong>Trabajo en Cuaderno:</strong><br>${step.notebook}</div>
                            <button class="btn btn-success" onclick="nextStep(${index})">Ya lo escribí en mi cuaderno ➔</button>
                        </div>
                    `;
                }
                else if (step.type === 'final') {
                    html += step.content;
                }

                card.innerHTML = html;
                container.appendChild(card);

                if (step.type === 'final' && index === currentStep) {
                    submitFinalGrade();
                }
            });

            updateProgress();
        }

        function updateProgress() {
            const percent = (currentStep / (stepsData.length - 1)) * 100;
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        function nextStep(currentIndex) {
            // Guardar confirmación de lectura / completado
            if (currentIndex !== undefined) {
            }

            if (currentStep < stepsData.length - 1) {
                currentStep++;
                saveProgress();
                renderSteps();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function checkOption(stepIndex, selected, correct) {
            const fb = document.getElementById(`feedback-${stepIndex}`);
            const nb = document.getElementById(`notebook-check-${stepIndex}`);
            const step = stepsData[stepIndex];

            if (selected === correct) {
                fb.className = "feedback correct";
                fb.innerHTML = `¡Correcto! ${step.explanation}`;
                nb.classList.add('show');

                studentAnswers[stepIndex] = { correct: true, val: selected };
                saveProgress();
            } else {
                fb.className = "feedback incorrect";
                fb.innerHTML = "Respuesta incorrecta. Revisa las propiedades del triángulo e inténtalo nuevamente.";
                nb.classList.remove('show');

            }
        }

        function checkInput(stepIndex, correctVal) {
            const val = parseFloat(document.getElementById(`input-${stepIndex}`).value);
            const fb = document.getElementById(`feedback-${stepIndex}`);
            const nb = document.getElementById(`notebook-check-${stepIndex}`);
            const step = stepsData[stepIndex];

            if (val === correctVal) {
                fb.className = "feedback correct";
                fb.innerHTML = `¡Excelente! ${step.explanation}`;
                nb.classList.add('show');

                studentAnswers[stepIndex] = { correct: true, val: val };
                saveProgress();
            } else {
                fb.className = "feedback incorrect";
                fb.innerHTML = "El resultado no es correcto. Realiza nuevamente la operación en tu cuaderno e ingresa el valor.";
                nb.classList.remove('show');

            }
        }

        function submitFinalGrade() {
            const exerciseSteps = stepsData
                .map((step, index) => ({ step, index }))
                .filter(({ step }) => step.type === 'exercise' || step.type === 'exercise_input');
            const score = exerciseSteps.filter(({ index }) =>
                studentAnswers[index] && studentAnswers[index].correct
            ).length;
            const gradeValue = 1 + (score / exerciseSteps.length) * 4;
            const calculatedGrade = Math.min(5, Math.max(1, gradeValue)).toFixed(1);

            document.getElementById('final-score').innerText =
                `Puntaje Final: ${score} / ${exerciseSteps.length}`;
            document.getElementById('final-grade').innerText =
                `Nota Calificada (escala de 1.0 a 5.0): ${calculatedGrade}`;

            sendDataToGoogleSheets(currentStudent, GRADE_NAME, calculatedGrade);
        }

        function sendDataToGoogleSheets(studentName, grade, finalNota) {
            const statusDiv = document.getElementById('send-status');
            if (APP_SCRIPT_URL.includes('REEMPLAZA_ESTO')) {
                statusDiv.style.backgroundColor = '#fee2e2';
                statusDiv.style.color = '#b91c1c';
                statusDiv.innerText = '⚠ Falta configurar la URL de implementación de Google Apps Script.';
                return;
            }

            statusDiv.style.backgroundColor = '#e0f2fe';
            statusDiv.style.color = '#0369a1';
            statusDiv.innerText = 'Registrando nota en la planilla docente...';

            const payload = {
                nombre: studentName,
                grado: grade,
                nota: parseFloat(finalNota)
            };

            fetch(APP_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            })
                .then(() => {
                    statusDiv.style.backgroundColor = '#fef3c7';
                    statusDiv.style.color = '#92400e';
                    statusDiv.innerText = 'Solicitud enviada. Verifica en la planilla que la nota aparezca registrada.';
                })
                .catch(error => {
                    console.error("Error al enviar la nota:", error);
                    statusDiv.style.backgroundColor = '#fee2e2';
                    statusDiv.style.color = '#b91c1c';
                    statusDiv.innerText = '⚠ No se pudo enviar automáticamente la nota. Toma una captura de pantalla y preséntala a tu profesor.';
                });
        }
    </script>
</body>

</html>
